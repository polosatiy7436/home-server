# ==================== SELF-HOSTED CLOUD STORAGE ====================
secrets:
  NEXTCLOUD_DB_USER:
    file: ../secrets/NEXTCLOUD_DB_USER
  NEXTCLOUD_DB_PASSWORD:
    file: ../secrets/NEXTCLOUD_DB_PASSWORD
  NEXTCLOUD_DB_NAME:
    file: ../secrets/NEXTCLOUD_DB_NAME

services:
  nextcloud:
    image: nextcloud
    container_name: nextcloud
    restart: always
    ports:
      - 8081:80
    volumes:
      - /home/pi/apps/nextcloud:/var/www/html
      # restic backup repo, served to devices via external storage "Backups"
      - /home/pi/Storage/backups/restic-repo:/mnt/restic-repo:ro
    environment:
      - POSTGRES_DB_FILE=/run/secrets/NEXTCLOUD_DB_NAME
      - POSTGRES_USER_FILE=/run/secrets/NEXTCLOUD_DB_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/NEXTCLOUD_DB_PASSWORD
      - POSTGRES_HOST=nextcloud_postgres
    depends_on:
      - nextcloud_postgres
    secrets:
      - NEXTCLOUD_DB_NAME
      - NEXTCLOUD_DB_USER
      - NEXTCLOUD_DB_PASSWORD

  nextcloud_postgres:
    image: postgres:16
    container_name: nextcloud_postgres
    restart: always
    volumes:
      - /home/pi/apps/nextcloud_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB_FILE: /run/secrets/NEXTCLOUD_DB_NAME
      POSTGRES_USER_FILE: /run/secrets/NEXTCLOUD_DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/NEXTCLOUD_DB_PASSWORD
    secrets:
      - NEXTCLOUD_DB_NAME
      - NEXTCLOUD_DB_USER
      - NEXTCLOUD_DB_PASSWORD
