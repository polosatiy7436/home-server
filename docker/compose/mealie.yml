# ==================== MEAL PLANNER ====================
secrets:
  OPENAI_API_KEY:
    file: ../secrets/OPENAI_API_KEY
  MEALIE_POSTGRES_PASSWORD:
    file: ../secrets/MEALIE_POSTGRES_PASSWORD
  MEALIE_POSTGRES_USER:
    file: ../secrets/MEALIE_POSTGRES_USER
  MEALIE_POSTGRES_DB:
    file: ../secrets/MEALIE_POSTGRES_DB

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    ports:
      - 9925:9000
    depends_on:
      mealie_postgres:
        condition: service_healthy
    volumes:
      - /home/pi/apps/mealie:/app/data/
    environment:
      - ALLOW_SIGNUP=true
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tbilisi
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      - BASE_URL=mealie-api.io
      - OPENAI_ENABLE_IMAGE_SERVICES=true
      - DB_ENGINE=postgres
      - POSTGRES_SERVER=mealie_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER_FILE=/run/secrets/MEALIE_POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/MEALIE_POSTGRES_PASSWORD
      - POSTGRES_DB_FILE=/run/secrets/MEALIE_POSTGRES_DB
    secrets:
      - source: OPENAI_API_KEY
        target: OPENAI_API_KEY
      - MEALIE_POSTGRES_USER
      - MEALIE_POSTGRES_PASSWORD
      - MEALIE_POSTGRES_DB
    restart: unless-stopped

  mealie_postgres:
    container_name: mealie_postgres
    image: postgres:15
    restart: always
    volumes:
      - /home/pi/apps/mealie_postgres:/var/lib/postgresql/data
      - ../healthcheck.sh:/healthcheck.sh:ro
    secrets:
      - MEALIE_POSTGRES_USER
      - MEALIE_POSTGRES_PASSWORD
      - MEALIE_POSTGRES_DB
    environment:
      POSTGRES_USER_FILE: /run/secrets/MEALIE_POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/MEALIE_POSTGRES_PASSWORD
      POSTGRES_DB_FILE: /run/secrets/MEALIE_POSTGRES_DB
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 5
