# ======================= Podcasts ======================

  podgrab:
    image: akhilrex/podgrab:latest
    container_name: podgrab
    restart: unless-stopped
    volumes:
      - /home/pi/apps/pdgrab/:/config
      - /home/pi/media/grabs:/assets
    ports:
      - 8086:8080
    environment:
      - PODGRAB_DESTINATION=/assets
      - PODGRAB_STRATEGY=all_episodes
      - PODGRAB_LOG_LEVEL=info

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - TZ=Asia/Tbilisi
      - SSRF_REQUEST_FILTER_WHITELIST=podgrab.maksimuladyka.org
    volumes:
      - /home/pi/apps/audiobookshelf/config:/config
      - /home/pi/media/podcasts:/podcasts
    ports:
      - 8087:80

# ==================== Web File Browser ====================
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    environment:
      - PUID=$(id -u)
      - PGID=$(id -g)
    ports:
      - "8090:80"
    volumes:
      - /home/pi/:/srv
      - /home/pi/apps/fileBrowser:/database.db
    restart: unless-stopped
