# Root compose file — each service group lives in compose/<group>.yml.
# `docker compose` from this directory works exactly as before; no -f flags needed.
include:
  - compose/dashboard.yml
  - compose/media.yml
  - compose/monitoring.yml
  - path: compose/photos.yml
    env_file: env/immich.env
  - compose/mealie.yml
  - compose/cloud.yml
  - compose/proxy.yml
  - compose/wiki.yml
  - compose/vaultwarden.yml
  - compose/dns.yml
  - compose/tools.yml
